# SC-350 cut software settings. Restart after editing:  sudo systemctl restart sc350cut

[folders]
hotfolder = /srv/cut/hotfolder
queue = /srv/cut/queue
archive = /srv/cut/archive
# every job's cut file, named by its QR code text
plt_export = /srv/cut/plt
# hours a job stays in the active cut queue before it is archived
queue_hours = 24

[web]
listen = 0.0.0.0
port = 8350

[jobs]
job_prefix = ALT
qr_text = {job_id}
# dropping a file with the same name again updates that job instead of making a new one
reuse_by_filename = true
# lines named like this (layer, id) or drawn in these colours are cut lines
cut_names = cutcontour, cut contour, cut, thru-cut, kiss-cut
cut_colors = #ff00ff, #ec008c, #e6007e

[sheet]
# print sheet, registration marks (SignCut Vulcan defaults: 5 mm marks, 10 mm from the edge)
sheet_width_mm = 297
sheet_height_mm = 420
mark_size_mm = 5
mark_inset_mm = 10
mark_count = 4
qr_size_mm = 12
# CUPS queue of the Xerox (lpstat -p lists them); empty = default printer
printer =
# lp -o options; the Xerox aborts jobs that name no tray (error 024-747).
# media=manual = Tray 5 (bypass), media=tray-1 = Tray 1
print_options = media=tray-1 print-color-mode=color

[cutter]
cutter_device = tcp://192.168.0.52:9100
units_per_mm = 40
# 0 = use the cutter's own setting
speed = 0
force = 0
# cut 0,0: mark1 = centre of the bottom-left mark (what SignCut does),
# mark1corner = its outer corner, sheet = sheet corner
origin = mark1
# portrait sheets are turned so the long side runs along the feed
rotate_portrait = true
# signcut = wrap each job like SignCut does (CMD:318 feed in + mark scan, CMD:319 feed out)
# plain = only preamble/postamble below
protocol = signcut
feed_params = 600,600,0
# QR mode: seconds to wait for the camera to read the QR code
qr_timeout = 60
preamble = IN;
postamble = PU0,0;SP0;
mirror = false
